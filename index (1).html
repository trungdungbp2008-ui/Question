#uehquiz::after{
  content:"";position:fixed;inset:0;left:0;top:0;width:100vw;height:100vh;z-index:-1;
  background:rgba(255,255,255,.82); /* chỉnh số .82 để ảnh mờ nhiều/ít, càng cao càng trắng */
}
@media (max-width:820px){
  /* Điện thoại (đặc biệt iOS Safari) không hỗ trợ tốt background-attachment:fixed nên dùng scroll thường */
  #uehquiz::before{background-attachment:scroll;position:absolute}
  #uehquiz::after{position:absolute}
}
#uehquiz h2{font-size:1.8rem;line-height:1.25;margin:0 0 10px;color:var(--c1)}
#uehquiz h3{margin:0 0 2px;font-size:1.12rem;color:var(--c1)}
#uehquiz p{margin:0 0 12px}
#uehquiz .soft{color:#4b6664}
#uehquiz .intro{background:rgba(243,248,248,.9);backdrop-filter:blur(2px);border-radius:16px;padding:28px 22px}
#uehquiz .prog{display:flex;align-items:center;gap:12px;margin:0 0 18px;font-weight:600;color:#4b6664;font-size:.95rem}
#uehquiz .bar{flex:1;height:8px;border-radius:4px;background:#d9e8e7;overflow:hidden}
#uehquiz .bar i{display:block;height:100%;background:var(--c2);transition:width .3s}
#uehquiz fieldset{border:0;padding:0;margin:0 0 14px}
#uehquiz legend{padding:0;margin:0 0 6px;font-weight:700;font-size:1.25rem;line-height:1.35;outline:0}
#uehquiz .hint{margin:0 0 14px;color:#4b6664;font-size:.95rem}
#uehquiz .opts{display:grid;gap:9px}
#uehquiz label{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #d3e3e2;border-radius:12px;padding:13px 15px;cursor:pointer;transition:border-color .15s,background .15s}
#uehquiz label:hover{border-color:var(--c1)}
#uehquiz label:has(input:checked){border-color:var(--c1);background:#e2f2f1}
#uehquiz input[type=radio]{accent-color:var(--c1);width:19px;height:19px;flex:none;margin:0}
#uehquiz input[type=radio]:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
#uehquiz button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 24px;cursor:pointer}
#uehquiz button:focus-visible,#uehquiz a:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
#uehquiz .go{background:var(--c1);color:#fff}
#uehquiz .go:hover{background:#0a5457}
#uehquiz .go[disabled]{background:#9db9b8;cursor:not-allowed}
#uehquiz .again{background:#fff;color:var(--c1);border:2px solid var(--c1)}
#uehquiz .nav{display:flex;gap:10px;flex-wrap:wrap}
#uehquiz .who{background:rgba(243,248,248,.9);backdrop-filter:blur(2px);border-radius:16px;padding:22px;margin:0 0 20px}
#uehquiz .who h2{margin-bottom:6px}
#uehquiz .card{background:rgba(255,255,255,.92);backdrop-filter:blur(2px);border:2px solid var(--c1);border-left-width:10px;border-radius:12px;padding:16px 18px;margin:0 0 12px}
#uehquiz .card .meta{font-size:.9rem;color:#4b6664;margin:0 0 6px}
#uehquiz .card .why{margin:8px 0 6px}
#uehquiz .card .bar{margin:8px 0 6px;flex:none}
#uehquiz .card a{display:inline-block;margin-top:6px;color:var(--c1);font-weight:700}
#uehquiz .msg{border-left:6px solid var(--c2);background:#fffaf0;border-radius:8px;padding:12px 16px;margin:0 0 10px}
#uehquiz ol{padding-left:22px;margin:0 0 18px}
#uehquiz ol li{margin:0 0 6px}
#uehquiz .cta{display:inline-block;background:var(--c2);color:#16302f;font-weight:700;text-decoration:none;border-radius:10px;padding:12px 24px;margin:0 8px 8px 0}

    {w:0,q:"Khi nghĩ đến việc bước vào một câu lạc bộ mới, bạn lo nhất điều gì?",hint:"Ai cũng có một nỗi lo riêng. Chọn điều gần với bạn nhất, không có đáp án đúng hay sai.",a:[

      ["Đứng ra dẫn dắt, chia việc cho mọi người","DYNAMIC,IBC,CTV,HRS,HUREA","hay đứng ra dẫn dắt nhóm","","lead"],
      ["Nghĩ ra ý tưởng và cách làm mới","SCOMS,MAR,TRAVEL,CTN,GDT,VNXK","hay nghĩ ra ý tưởng mới","","creative"],
      ["Làm việc chăm chỉ, chắc tay","A2C,TAX,SFR,ASC,SSG,CTXH","làm việc chắc tay, có trách nhiệm","","doer"],
      ["Kết nối mọi người, giữ không khí vui","CTV,CTXH,SSG,UEHG,BC,BM,BK","hay kết nối mọi người","","connector"]

      ["Thuyết trình, kể chuyện, truyền thông","CTN,SCOMS,LLT","muốn rèn thuyết trình và truyền thông"],
      ["Kinh doanh, khởi nghiệp","DYNAMIC,IBC,IC,HRS","muốn học kinh doanh và khởi nghiệp"],
      ["Nghiên cứu, phân tích số liệu","ASC,TAX,SFR,YORE,A2C","muốn rèn tư duy phân tích"]
    ]},
    {w:2,q:"Lĩnh vực nào khiến bạn tò mò nhất?",hint:"Chưa chắc ngành của mình cũng không sao, cứ chọn điều bạn thấy hứng thú.",a:[
      ["Marketing, du lịch","MAR,TRAVEL,SCOMS","tò mò về marketing và du lịch"],

      ["Nhân sự, pháp lý, bất động sản","HUREA,HRS,PL,REC","tò mò về nhân sự, pháp lý hoặc bất động sản"],

      ["Có kinh nghiệm thật để ghi vào CV","IC,IBC,DYNAMIC,HUREA,A2C,HRS","muốn có kinh nghiệm thực tế cho CV"],
      ["Có một nhóm bạn thân thiết","CTV,CTXH,SSG,BC,BM,BK,UEHG,ESP","muốn có một nhóm bạn thân"],
      ["Giỏi lên rõ rệt ở chuyên môn","ASC,TAX,SFR,SCUE,YORE,ET,A2C,PL","muốn giỏi hơn ở chuyên môn"],
      ["Làm được điều có ích cho người khác","CTXH,SSG,CTV","muốn làm điều có ích cho người khác"]
    ]},
    {w:0,q:"Mỗi tuần bạn có thể dành bao nhiêu thời gian cho câu lạc bộ?",a:[
      ["Khoảng 1 đến 2 giờ","","","Với 1 đến 2 giờ mỗi tuần, hãy hỏi trước lịch sinh hoạt để chọn nơi phù hợp với quỹ thời gian của bạn."],

      ["Hơn 5 giờ","","","Bạn có thời gian để đầu tư sâu. Hãy thử xin một vai trò cụ thể trong ban tổ chức hoặc một dự án."],
      ["Mình chưa biết","","","Chưa biết cũng không sao. Hãy hỏi ban chủ nhiệm cần đầu tư bao nhiêu giờ mỗi tuần trước khi quyết định."]

      ["Được giao một việc cụ thể để làm ngay","","","Hãy nói với ban chủ nhiệm rằng bạn thích có nhiệm vụ rõ ràng ngay từ đầu, việc này giúp bạn hòa nhập nhanh hơn."],
      ["Quan sát vài buổi rồi mới hòa nhập","","","Hãy theo dõi fanpage và các sự kiện mở của câu lạc bộ để làm quen từ xa trước khi tham gia."],
      ["Tự giới thiệu và làm quen với mọi người","","","Bạn dễ hòa nhập, hãy chủ động đến các buổi gặp mặt và nói chuyện với nhiều thành viên."]
    ]}
  ];

  // ===== 4. GIAO DIỆN =====
  var root = document.getElementById("uehquiz");
  var view = document.getElementById("uq-view");
  var ans = [];

  function top() { root.scrollIntoView({ behavior: "smooth", block: "start" }); }

  function intro() {
    view.innerHTML =
      '<div class="intro"><h2>Bạn mới vào UEH? Tìm nơi dành cho bạn</h2>' +
      '<p>Không có đáp án đúng hay sai, và chưa biết mình thích gì cũng hoàn toàn ổn. ' +
      'Trả lời ' + Q.length + ' câu hỏi ngắn, chúng mình sẽ gợi ý 3 câu lạc bộ, đội, nhóm hợp với bạn và vài lời nhắn để bạn tự tin bước vào.</p>' +
      '<p class="soft">Mất khoảng 2 phút.</p>' +
      '<button type="button" class="go" id="uq-start">Bắt đầu</button></div>';
    document.getElementById("uq-start").addEventListener("click", function () { ask(0); });
  }

  function ask(i) {
    var q = Q[i], h = "";
    h += '<div class="prog"><span>Câu ' + (i + 1) + '/' + Q.length + '</span><div class="bar"><i style="width:' + Math.round(i / Q.length * 100) + '%"></i></div></div>';
    h += '<fieldset><legend id="uq-leg" tabindex="-1">' + q.q + '</legend>';
    if (q.hint) h += '<p class="hint">' + q.hint + '</p>';
    h += '<div class="opts">';
    q.a.forEach(function (o, j) {
      h += '<label><input type="radio" name="uq" value="' + j + '"' + (ans[i] === j ? " checked" : "") + '> ' + o[0] + '</label>';
    });
    h += '</div></fieldset><div class="nav">';
    if (i > 0) h += '<button type="button" class="again" id="uq-back">Câu trước</button>';
    h += '<button type="button" class="go" id="uq-next"' + (ans[i] === undefined ? " disabled" : "") + '>' + (i === Q.length - 1 ? "Xem gợi ý của tôi" : "Câu tiếp") + '</button></div>';
    view.innerHTML = h;

    var next = document.getElementById("uq-next");
    function go() { if (i < Q.length - 1) ask(i + 1); else result(); }
    view.querySelectorAll('input[name="uq"]').forEach(function (r) {
      r.addEventListener("change", function () {
        ans[i] = +r.value;
        next.disabled = false;
        setTimeout(go, 250);
      });
    });
    next.addEventListener("click", go);
    if (i > 0) document.getElementById("uq-back").addEventListener("click", function () { ask(i - 1); });
    document.getElementById("uq-leg").focus({ preventScroll: true });
    top();
  }

  function result() {
    var score = {}, matched = {}, why = {}, tips = [], persona = null, total = 0;
    Q.forEach(function (q, i) {
      var o = q.a[ans[i]];
      if (o[3]) tips.push(o[3]);
      if (o[4]) persona = PERSONA[o[4]];
      if (!q.w) return;
      total += q.w;
      o[1].split(",").forEach(function (k) {
        if (!CLB[k]) return;
        score[k] = (score[k] || 0) + q.w;
        matched[k] = (matched[k] || 0) + 1;
        (why[k] = why[k] || []).push(o[2]);
      });
    });
    var order = Object.keys(CLB);
    var best = Object.keys(score).sort(function (a, b) {
      return score[b] - score[a] || matched[b] - matched[a] || order.indexOf(a) - order.indexOf(b);
    }).slice(0, 3);

    var h = "";
    if (persona) h += '<div class="who"><h2>Bạn có vẻ là ' + persona.t + '</h2><p>' + persona.d + '</p></div>';
    h += '<h2>3 nơi có thể hợp với bạn</h2>';
    best.forEach(function (k) {
      var c = CLB[k];
      h += '<div class="card"><h3>' + c.n + '</h3><p class="meta">' + c.g + '</p>' +
        '<p class="why">Vì bạn ' + why[k].slice(0, 3).join(", ") + '.</p>' +
        '<div class="bar" aria-hidden="true"><i style="width:' + Math.round(score[k] / total * 100) + '%"></i></div>' +
        '<span class="soft">Trùng ở ' + matched[k] + ' khía cạnh trong câu trả lời của bạn</span>' +
        (c.link ? '<br><a href="' + c.link + '" target="_blank" rel="noopener">Xem fanpage</a>' : "") + '</div>';
    });
    if (tips.length) {
      h += '<h2 class="sec">Vài lời nhắn dành riêng cho bạn</h2>';
      tips.forEach(function (t) { h += '<div class="msg">' + t + '</div>'; });
    }
    h += '<h2 class="sec">Bước tiếp theo</h2><ol>' +
      '<li>Mở fanpage của câu lạc bộ bạn thấy hợp và xem các hoạt động gần đây.</li>' +
      '<li>Nhắn ban chủ nhiệm hỏi lịch sinh hoạt, số giờ mỗi tuần và hình thức tuyển chọn.</li>' +
      '<li>Đăng ký 1 đến 2 nơi trước, rồi điều chỉnh sau khi trải nghiệm.</li></ol>' +
      '<p class="soft">Bạn không cần chọn đúng ngay từ lần đầu. Thử một hai nơi rồi điều chỉnh vẫn là cách an toàn để tìm ra chỗ của mình.</p>' +
      (REG_LINK ? '<a class="cta" href="' + REG_LINK + '" target="_blank" rel="noopener">Đăng ký ngay</a>' : "") +
      '<button type="button" class="again" id="uq-reset">Làm lại bài trắc nghiệm</button>';
    view.innerHTML = h;
